# ==============================================================================
# Hardened Docker Compose Production Specification
# - Read-only root filesystem with explicit memory tmpfs
# - Linux capability drops (ALL) and no-new-privileges
# - CPU and Memory resource limits to prevent host exhaustion
# - Rotated JSON log files with max-size and max-file caps
# - Network isolation (internal bridge for backend tiers)
# - Deterministic health checks with startup grace periods
# ==============================================================================

services:
  backend-api:
    image: ghcr.io/my-org/backend-api:v2.0.0
    container_name: backend-api
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://appuser:${DB_PASSWORD}@db:5432/appdb?sslmode=disable
    ports:
      - "8080:8080"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=appdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Disallow external internet access for database network

volumes:
  postgres-data:
    driver: local
