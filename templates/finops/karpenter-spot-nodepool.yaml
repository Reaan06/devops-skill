# ==============================================================================
# Karpenter v1.0+ Production Spot NodePool & EC2NodeClass
# - Optimized for aggressive Spot diversification and runtime consolidation
# - Enforces IMDSv2 metadata hardening and multi-architecture scheduling (x86/ARM)
# ==============================================================================
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot-general-compute
  labels:
    app.kubernetes.io/part-of: platform-infrastructure
    app.kubernetes.io/managed-by: karpenter
spec:
  template:
    metadata:
      labels:
        node.kubernetes.io/capacity-type: spot
        environment: production
        team: platform
    spec:
      # Reference to the AWS-specific EC2 NodeClass
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default-spot-node-class

      # Spot Instance Diversification Requirements
      requirements:
        # Enforce Spot compute capacity
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]

        # Support both AMD64 and ARM64 (Graviton) architectures
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]

        # Support Compute, Memory, and General Purpose optimized families
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        # Target modern instance generations (e.g. c6g, c7g, m6i, m7i, r6i)
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

        # Filter out burstable or underpowered instances unsuitable for production
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small"]

        # Restrict to hypervisors with fast hardware virtualization
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]

      # Node expiration forces clean AMI rotation and prevents configuration drift
      expireAfter: 720h # 30 days node lifetime

  # Consolidation and Disruption Controls
  disruption:
    # Continuously downscale underutilized or empty nodes
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 1m

    # Disruption budgets safeguard against excessive simultaneous pod evictions
    budgets:
      - nodes: 10% # Maximum 10% of nodes disrupted concurrently
        schedule: "0 9 * * 1-5" # Business hours rate limiting
        duration: 8h
      - nodes: 20% # Standard off-peak consolidation rate

  # Cluster-wide resource ceiling safeguards
  limits:
    cpu: 1000
    memory: 2000Gi

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default-spot-node-class
  labels:
    app.kubernetes.io/part-of: platform-infrastructure
    app.kubernetes.io/managed-by: karpenter
spec:
  # Base Operating System AMI
  amiFamily: AL2023

  # Auto-discover AMIs managed by AWS EKS optimized AMI releases
  amiSelectorTerms:
    - alias: al2023@latest

  # Node IAM Role with Karpenter node permissions
  role: "KarpenterNodeRole-production-eks"

  # Auto-discover VPC Subnets tagged for Karpenter provisioning
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "production-eks-cluster"

  # Auto-discover Node Security Groups
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "production-eks-cluster"

  # Hardened Root EBS Block Device Configuration
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  # Security Hardening: Enforce IMDSv2 to prevent SSRF credential theft
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  # Cloud Cost Allocation & FinOps Tags applied directly to EC2 Instances
  tags:
    Environment: "production"
    CostCenter: "cloud-platform"
    ManagedBy: "karpenter"
    BillingTier: "spot-workloads"
