name: Checkov IaC & Container Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1" # Run weekly audit at 04:00 UTC on Mondays
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov Policy & Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov Static Analysis (Terraform, Kubernetes, Docker)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: "."
          framework: "terraform,kubernetes,dockerfile"
          output_format: "cli,sarif"
          output_file_path: "console,checkov-results.sarif"
          soft_fail: false
          download_external_modules: true
        env:
          PRISMA_API_URL: https://api.prismacloud.io

      - name: Upload Checkov SARIF report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: "checkov-results.sarif"
          category: "checkov-iac"
