---
# Enterprise GitLab CI/CD Pipeline
# Features: DAG stages, Kaniko rootless image builds, Trivy container scanning,
# and keyless cloud deployment via GitLab OIDC federation.

stages:
  - lint
  - test
  - build
  - security
  - deploy

variables:
  DOCKER_IMAGE_NAME: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  DOCKER_IMAGE_LATEST: "${CI_REGISTRY_IMAGE}:latest"
  SCAN_SEVERITY: "CRITICAL,HIGH"

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# 1. Lint Stage
# ==============================================================================
"lint:static-analysis":
  stage: lint
  image: cytopia/yamllint:latest
  script:
    - 'yamllint -d "{extends: default, rules: {line-length: disable}}" .'

# ==============================================================================
# 2. Test Stage
# ==============================================================================
"test:unit":
  stage: test
  image: golang:1.24-bookworm
  needs: []
  script:
    - go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
  artifacts:
    expire_in: 7 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.txt

# ==============================================================================
# 3. Build Stage (Kaniko Rootless Container Builder)
# ==============================================================================
"build:container-image":
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - "test:unit"
  before_script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${DOCKER_IMAGE_NAME}"
      --destination "${DOCKER_IMAGE_LATEST}"
      --cache=true
      --cache-copy-layers=true

# ==============================================================================
# 4. Security Stage (Trivy Vulnerability Scanner)
# ==============================================================================
"security:trivy-scan":
  stage: security
  image:
    name: aquasec/trivy:0.59.1
    entrypoint: [""]
  needs:
    - "build:container-image"
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    - trivy image --download-db-only
    - trivy image --exit-code 0 --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "${DOCKER_IMAGE_NAME}"
    - trivy image --exit-code 1 --severity "${SCAN_SEVERITY}" --ignore-unfixed "${DOCKER_IMAGE_NAME}"
  cache:
    paths:
      - .trivycache/
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json

# ==============================================================================
# 5. Deploy Stage (Keyless OIDC Cloud Deployment)
# ==============================================================================
"deploy:production":
  stage: deploy
  image: amazon/aws-cli:2.24.16
  needs:
    - "security:trivy-scan"
  id_tokens:
    AWS_JWT_TOKEN:
      aud: https://aws.amazon.com
  environment:
    name: production
    url: https://api.enterprise.internal
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - >
      AWS_CREDENTIALS=$(aws sts assume-role-with-web-identity
      --role-arn "${AWS_ROLE_ARN}"
      --role-session-name "gitlab-deploy-${CI_JOB_ID}"
      --web-identity-token "${AWS_JWT_TOKEN}"
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "${AWS_CREDENTIALS}" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "${AWS_CREDENTIALS}" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "${AWS_CREDENTIALS}" | awk '{print $3}')
    - echo "Successfully authenticated to AWS via GitLab OIDC Token"
    - aws sts get-caller-identity
