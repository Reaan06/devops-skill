# ==============================================================================
# cert-manager ClusterIssuer Configuration
# Let's Encrypt ACME automated certificate issuance supporting HTTP-01 & DNS-01
# ==============================================================================
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/managed-by: cert-manager
spec:
  acme:
    # Let's Encrypt Staging API endpoint (prevents production rate limits during testing)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: devops-alerts@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/managed-by: cert-manager
spec:
  acme:
    # Let's Encrypt Production API endpoint (trusted by browser roots)
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops-alerts@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01-prod
  labels:
    app.kubernetes.io/managed-by: cert-manager
spec:
  acme:
    # ACME DNS-01 Solver required for Wildcard (*.example.com) and internal ingress certificates
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops-alerts@example.com
    privateKeySecretRef:
      name: letsencrypt-dns01-account-key
    solvers:
      - selector:
          dnsZones:
            - example.com
        dns01:
          # AWS Route53 solver using IRSA / ambient IAM credentials
          route53:
            region: us-east-1
            role: arn:aws:iam::123456789012:role/cert-manager-route53-solver
          # Alternative Cloudflare solver configuration:
          # cloudflare:
          #   apiTokenSecretRef:
          #     name: cloudflare-api-token-secret
          #     key: api-token
