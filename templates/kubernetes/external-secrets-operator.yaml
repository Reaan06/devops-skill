# ==============================================================================
# External Secrets Operator (external-secrets.io/v1beta1)
# Synchronizes sensitive credentials from remote vaults into native K8s Secrets
# ==============================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  conditions:
    - namespaces:
        - production-apps
        - staging-apps
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-irsa-serviceaccount
            namespace: external-secrets

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hashicorp-vault
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  conditions:
    - namespaces:
        - production-apps
        - staging-apps
  provider:
    vault:
      server: "https://vault.internal.example.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "app-workload-role"
          serviceAccountRef:
            name: eso-vault-serviceaccount
            namespace: external-secrets

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-api-secrets
  namespace: production-apps
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: core-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-api-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
      data:
        # Custom secret formatting or injection
        DATABASE_URL: "postgresql://{{ .DB_USER }}:{{ .DB_PASSWORD }}@{{ .DB_HOST }}:5432/{{ .DB_NAME }}?sslmode=verify-full"
        API_SECRET_KEY: "{{ .SECRET_KEY }}"
  data:
    # Explicit mapping from AWS Secrets Manager JSON payload
    - secretKey: DB_USER
      remoteRef:
        key: production/backend-api/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: production/backend-api/database
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: production/backend-api/database
        property: host
    - secretKey: DB_NAME
      remoteRef:
        key: production/backend-api/database
        property: dbname
    - secretKey: SECRET_KEY
      remoteRef:
        key: production/backend-api/application
        property: secret_key
