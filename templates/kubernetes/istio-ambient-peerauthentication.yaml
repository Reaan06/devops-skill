apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: production-apps
  labels:
    app.kubernetes.io/name: istio-ambient-policy
    app.kubernetes.io/instance: production
    app.kubernetes.io/part-of: core-platform
    app.kubernetes.io/component: security-mesh
    app.kubernetes.io/managed-by: istio
spec:
  # In Istio Ambient Mesh, namespace workloads enrolled via 'istio.io/dataplane-mode: ambient'
  # are transparently proxied by node-level ztunnel daemons.
  # STRICT mode mandates cryptographic mTLS over HBONE (port 15008) for all inbound connections,
  # rejecting plain unencrypted TCP traffic while avoiding per-pod sidecar containers.
  mtls:
    mode: STRICT
