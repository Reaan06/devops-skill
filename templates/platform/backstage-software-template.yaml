apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hardened-cloudnative-service
  title: Hardened Cloud-Native Microservice
  description: "Scaffolds an enterprise-grade service with PSS Restricted Kubernetes manifests, Distroless container, KEDA autoscaling, and automated GitOps onboarding"
  tags:
    - recommended
    - kubernetes
    - golden-path
    - devsecops
spec:
  owner: platform-engineering
  type: service
  parameters:
    - title: Service Identity & Governance
      required:
        - serviceName
        - owner
        - description
        - system
      properties:
        serviceName:
          title: Service Name
          type: string
          description: "Unique name of the service (DNS RFC 1123 compliant: lowercase alphanumeric and hyphens)"
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        owner:
          title: Owning Engineering Team
          type: string
          description: "Backstage group entity representing service ownership (e.g., group:core-payments)"
        system:
          title: Parent System
          type: string
          description: "Backstage System this service belongs to (e.g., system:financial-gateway)"
        description:
          title: Description
          type: string
          description: "Clear summary of the microservice domain and responsibility"
    - title: Architecture & Runtime Capabilities
      required:
        - runtimeLanguage
        - databaseEngine
      properties:
        runtimeLanguage:
          title: Runtime Stack
          type: string
          default: golang
          enum:
            - golang
            - rust
            - java21
            - nodejs
          enumNames:
            - "Go 1.24 (Distroless Static, 4MB)"
            - "Rust 1.85 (Cargo Chef, Distroless, 12MB)"
            - "Java 21 (Temurin, CDS & Layered JAR, 180MB)"
            - "Node.js 22 LTS (Debian Slim, Unprivileged, 110MB)"
        databaseEngine:
          title: Cloud Persistence (Crossplane)
          type: string
          default: postgresql
          enum:
            - postgresql
            - none
          enumNames:
            - "Managed PostgreSQL (Crossplane AWS RDS / GCP CloudSQL)"
            - "None (Stateless Service)"
        enableKedaAutoscaling:
          title: Enable KEDA Event-Driven Autoscaling
          type: boolean
          default: true
          description: "Generates KEDA ScaledObject with Prometheus traffic triggers instead of basic CPU/Memory HPA"
  steps:
    - id: fetch-skeleton
      name: Render Golden Path Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          description: ${{ parameters.description }}
          runtimeLanguage: ${{ parameters.runtimeLanguage }}
          databaseEngine: ${{ parameters.databaseEngine }}
          enableKedaAutoscaling: ${{ parameters.enableKedaAutoscaling }}
    - id: publish-git
      name: Provision GitHub Repository
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=enterprise-org&repo=${{ parameters.serviceName }}
        defaultBranch: main
        protectDefaultBranch: true
        repoVisibility: internal
        deleteBranchOnMerge: true
    - id: register-catalog
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-git'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-git'].output.remoteUrl }}
      - title: Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
